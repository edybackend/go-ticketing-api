name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet, lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # 200 buyers for one seat, all-or-nothing holds, expiry, idempotent purchase, SSE across clients, slow subscribers.
      - run: go test -race -count=3 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  container:
    name: Container (holds, conflicts and the live stream)
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Two clients, one seat
        run: |
          set -euo pipefail
          docker compose up -d
          u=http://localhost:8080
          for i in $(seq 1 30); do curl -fs $u/healthz && break; sleep 2; done
          curl -fs $u/ | grep -q 'live seat map'
          curl -sN $u/v1/events/jazz-night/stream > stream.txt &
          sleep 1
          hold() { curl -s -o /dev/null -w '%{http_code}' -X POST $u/v1/events/jazz-night/holds \
                     -H 'content-type: application/json' -d "{\"seats\":[\"G7\"],\"customer\":\"$1\"}"; }
          # 50 buyers at once: exactly one 201.
          pids=()
          for i in $(seq 1 50); do hold "buyer$i" > "code$i" & pids+=($!); done
          wait "${pids[@]}"   # only the 50 holds; the stream keeps running
          [ "$(cat code* | grep -o 201 | wc -l)" -eq 1 ]
          [ "$(cat code* | grep -o 409 | wc -l)" -eq 49 ]
          grep -q '"seats":\["G7"\],"status":"held"' stream.txt
      - if: always()
        run: docker compose logs && docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
